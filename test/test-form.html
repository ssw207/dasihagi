<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><title>폼 프리셋 테스트</title></head>
<body>
  <h1>폼 프리셋 테스트 페이지</h1>
  <form>
    <p><label>이름 <input type="text" name="name" placeholder="이름"></label></p>
    <p><label>이메일 <input type="email" name="email" placeholder="이메일"></label></p>
    <p><label>부서
      <select name="dept">
        <option value="">선택하세요</option>
        <option value="eng">엔지니어링</option>
        <option value="sales">영업</option>
        <option value="mkt">마케팅</option>
      </select>
    </label></p>
    <p><label><input type="checkbox" name="agree"> 약관 동의</label></p>
    <p>결제수단
      <label><input type="radio" name="payment" value="card"> 카드</label>
      <label><input type="radio" name="payment" value="bank"> 계좌이체</label>
    </p>
    <p><textarea name="memo" placeholder="메모"></textarea></p>
  </form>
  <p><button type="button" id="open-modal">상세 입력</button></p>
  <div id="input-modal" hidden>
    <p><label>추가 메모 <input type="text" name="modal_note" id="modal-note" placeholder="추가 메모"></label></p>
    <p><button type="button" id="modal-confirm">확인</button></p>
  </div>
  <script>
    document.getElementById('open-modal').addEventListener('click', function () {
      document.getElementById('input-modal').hidden = false;
    });
    document.getElementById('modal-confirm').addEventListener('click', function () {
      document.getElementById('input-modal').hidden = true;
    });
  </script>
</body>
</html>
